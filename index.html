<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiteRT Card Detector</title>
<style>
body{margin:0;background:#111;color:#eee;font-family:system-ui,sans-serif;text-align:center;padding:10px}
#status{margin:8px 0;font-size:14px;padding:8px;background:#222;border-radius:8px;min-height:40px}
#wrap{position:relative;display:inline-block;max-width:100%}
video{max-width:100%;border-radius:8px;display:block}
canvas{position:absolute;left:0;top:0;pointer-events:none;max-width:100%}
</style>
</head>
<body>
<h2>LiteRT Card Detector</h2>
<div id="status">Loading…</div>
<div id="wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>

<!-- Load LiteRT.js from CDN -->
<script type="module">
import { loadLiteRt, loadAndCompile } from 'https://cdn.jsdelivr.net/npm/@litertjs/core/+esm';
import { runWithTfjsTensors } from 'https://cdn.jsdelivr.net/npm/@litertjs/tfjs-interop/+esm';
import * as tf from 'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs/+esm';
import 'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgpu/+esm';
import { WebGPUBackend } from 'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgpu/+esm';

const status = document.getElementById('status');
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const log = (msg) => { status.textContent = msg; };

try {
  // 0. Initialize TFJS WebGPU backend FIRST
  log('Initializing TFJS WebGPU backend…');
  try {
  await tf.setBackend('webgpu');
} catch (e) {
  console.warn('WebGPU not available, falling back to wasm');
  await tf.setBackend('wasm');
}
  const backend = tf.backend();
  
  // 1. Initialize LiteRT.js
  log('Loading LiteRT runtime…');
  await loadLiteRt('https://cdn.jsdelivr.net/npm/@litertjs/core/wasm/');
  
  // Share the GPU device between TFJS and LiteRT (required for tensor conversion)
  const { liteRt } = await import('https://cdn.jsdelivr.net/npm/@litertjs/core/+esm');
  liteRt.setWebGpuDevice(backend.device);

  // 2. Load your .tflite model
  log('Loading card model…');
  const model = await loadAndCompile('best.tflite', { accelerator: 'wasm' });
  log('Model loaded! Starting camera…');

  // 3. Start camera
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
  });
  video.srcObject = stream;
  await new Promise(r => video.onloadedmetadata = r);
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  log('Camera ready. Scanning for cards…');

  // 4. Detection loop
  let running = false;
  const detect = async () => {
    if (!running && video.readyState === 4) {
      running = true;
      try {
        // Preprocess: convert video frame to a TF tensor
        const input = tf.tidy(() => {
          const img = tf.browser.fromPixels(video);
          const resized = tf.image.resizeBilinear(img, [640, 640]);
          const normalized = resized.div(255.0);
          // LiteRT might expect NHWC or NCHW. Try NHWC first.
          return normalized.expandDims(0);
        });

        // Run the model
        const outputs = await runWithTfjsTensors(model, [input]);
        input.dispose();

        // For now, just log that we got output. Parsing OBB comes next.
        const out = outputs[0];
        const shape = out.shape;
        log(`Model output shape: ${shape.join(', ')}`);
        
        // Clean up
        out.dispose();
      } catch (e) {
        console.error(e);
        log('Detection error: ' + e.message);
      }
      running = false;
    }
    requestAnimationFrame(detect);
  };
  detect();

} catch (e) {
  console.error(e);
  log('❌ Error: ' + e.message);
}
</script>
</body>
</html>
