<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiteRT Card Detector</title>
<style>
body{margin:0;background:#111;color:#eee;font-family:system-ui,sans-serif;text-align:center;padding:10px}
#status{margin:8px 0;font-size:14px;padding:8px;background:#222;border-radius:8px;min-height:40px}
#wrap{position:relative;display:inline-block;max-width:100%}
video{max-width:100%;border-radius:8px;display:block}
canvas{position:absolute;left:0;top:0;pointer-events:none;max-width:100%}
</style>
</head>
<body>
<h2>LiteRT Card Detector</h2>
<div id="status">Loading…</div>
<div id="wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>

<script type="module">
import 'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js';
import { loadLiteRt, loadAndCompile } from 'https://cdn.jsdelivr.net/npm/@litertjs/core@2.6.0/+esm';
import { runWithTfjsTensors } from 'https://cdn.jsdelivr.net/npm/@litertjs/tfjs-interop/+esm';
import 'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-wasm@4.22.0/dist/tf-backend-wasm.min.js';
console.log('TF version:', tf?.version?.tfjs);

const tf = window.tf;
const status = document.getElementById('status');
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const log = (msg) => { status.textContent = msg; };

(async () => {
  try {
    log('Step 1: Loading LiteRT runtime from /yolo-test/wasm/…');
    await tf.setBackend('wasm');
    // --- DIAGNOSTIC: Check if the WASM file is reachable ---
log('Checking WASM file status…');
try {
  const response = await fetch('/yolo-test/wasm/litert_wasm_internal.js');
  log('WASM file status: ' + response.status);
  if (response.status !== 200) {
    log('❌ Error: The file is not at that path. Status: ' + response.status);
    return; // Stop here so we don't hang on loadLiteRt
  }
} catch (e) {
  log('❌ Fetch failed: ' + e.message);
  return;
}
// -------------------------------------------------------
    await loadLiteRt('/yolo-test/wasm/');
    log('Step 2: Runtime loaded. Loading model…');

    const model = await loadAndCompile('/yolo-test/best.tflite', { accelerator: 'wasm' });
    log('Step 3: Model loaded. Starting camera…');

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
    });
    video.srcObject = stream;
    await new Promise(r => video.onloadedmetadata = r);
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    log('Step 4: Camera ready. Running inference…');

const input = tf.tidy(() => {
  const img = tf.browser.fromPixels(video);          // [H, W, 3]
  const resized = tf.image.resizeBilinear(img, [640, 640]); // [640, 640, 3]
  const normalized = resized.div(255.0).expandDims(0);     // [1, 640, 640, 3]
  return normalized.transpose([0, 3, 1, 2]);               // [1, 3, 640, 640]
});

    const outputs = await runWithTfjsTensors(model, [input]);
    input.dispose();

    const out = outputs[0];
    log('✅ SUCCESS. Output shape: ' + out.shape.join(', '));
    out.dispose();

  } catch (e) {
    console.error(e);
    log('❌ Error: ' + (e.message || String(e)));
  }
})();
</script>
</body>
</html>
