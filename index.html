<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YOLO Direct Test</title>
<style>
body{margin:0;background:#111;color:#eee;font-family:system-ui,sans-serif;text-align:center;padding:20px}
#status{margin-top:20px;font-size:16px;padding:12px;background:#222;border-radius:8px;min-height:60px}
video,canvas{max-width:90vw;margin-top:20px;border-radius:8px}
canvas{position:absolute;left:0;top:0;pointer-events:none}
#wrap{position:relative;display:inline-block}
</style>
</head>
<body>
<h2>YOLO Direct Test</h2>
<div id="status">Loading TensorFlow.js…</div>
<div id="wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.22.0/dist/tf-backend-webgl.min.js"></script>

<script>
(async () => {
  const status = document.getElementById('status');
  const log = (msg) => { status.textContent = msg; };

  try {
    // Step 1: Check TensorFlow.js loaded
    if (typeof tf === 'undefined') {
      log('❌ TensorFlow.js did not load.');
      return;
    }
    log('✅ TensorFlow.js loaded. Version: ' + tf.version.tfjs);

    // Step 2: Load the YOLO model directly
    log('Loading YOLO model… (this may take a few seconds)');
    const model = await tf.loadGraphModel(
      'https://raw.githubusercontent.com/Hyuto/yolov8-tfjs/master/public/yolov8n_web_model/model.json'
    );
    log('✅ Model loaded successfully!');

    // Step 3: Start camera to confirm it works
    log('Model loaded. Starting camera…');
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }
    });
    const video = document.getElementById('video');
    video.srcObject = stream;
    await new Promise(r => video.onloadedmetadata = r);
    
    log('✅ Camera ready. The pipeline works! (Detection logic can be added next.)');

  } catch (e) {
    log('❌ Error: ' + e.message);
  }
})();
</script>
</body>
</html>
