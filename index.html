<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiteRT Card Detector</title>
<style>
body{margin:0;background:#111;color:#eee;font-family:system-ui,sans-serif;text-align:center;padding:10px}
#status{margin:8px 0;font-size:14px;padding:8px;background:#222;border-radius:8px;min-height:40px}
#wrap{position:relative;display:inline-block;max-width:100%}
video{max-width:100%;border-radius:8px;display:block}
canvas{position:absolute;left:0;top:0;pointer-events:none;max-width:100%}
</style>
</head>
<body>
<h2>LiteRT Card Detector</h2>
<div id="status">Loading…</div>
<div id="wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>

<script type="module">
import { loadLiteRt, loadAndCompile } from 'https://cdn.jsdelivr.net/npm/@litertjs/core/+esm';
import { runWithTfjsTensors } from 'https://cdn.jsdelivr.net/npm/@litertjs/tfjs-interop/+esm';
import * as tf from 'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs/+esm';

const status = document.getElementById('status');
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const log = (msg) => { status.textContent = msg; };

(async () => {
  try {
    // 1. Initialize LiteRT runtime from your uploaded wasm folder
    log('Loading LiteRT runtime…');
    await loadLiteRt('/yolo-test/wasm/');
    log('LiteRT runtime loaded. Loading card model…');

    // 2. Load the .tflite model
    const model = await loadAndCompile('/yolo-test/best.tflite', { accelerator: 'wasm' });
    log('Model loaded. Starting camera…');

    // 3. Start camera
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
    });
    video.srcObject = stream;
    await new Promise(r => video.onloadedmetadata = r);
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    log('Camera ready. Running first inference…');

    // 4. Single test inference to confirm the model works
    const input = tf.tidy(() => {
      const img = tf.browser.fromPixels(video);
      const resized = tf.image.resizeBilinear(img, [640, 640]);
      return resized.div(255.0).expandDims(0);
    });

    const outputs = await runWithTfjsTensors(model, [input]);
    input.dispose();

    const out = outputs[0];
    log('✅ Model output shape: ' + out.shape.join(', '));
    out.dispose();

  } catch (e) {
    console.error(e);
    log('❌ Error: ' + (e.message || String(e)));
  }
})();
</script>
</body>
</html>
