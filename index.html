<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiteRT Card Detector</title>
<style>
body{margin:0;background:#111;color:#eee;font-family:system-ui,sans-serif;text-align:center;padding:10px}
#status{margin:8px 0;font-size:14px;padding:8px;background:#222;border-radius:8px;min-height:40px}
#wrap{position:relative;display:inline-block;max-width:100%}
video{max-width:100%;border-radius:8px;display:block}
canvas{position:absolute;left:0;top:0;pointer-events:none;max-width:100%}
</style>
</head>
<body>
<h2>LiteRT Card Detector</h2>
<div id="status">Loading…</div>
<div id="wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>

<script type="module">
document.getElementById('status').textContent = 'Step 1: Script loaded.';

import * as tf from 'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/+esm';
document.getElementById('status').textContent = 'Step 2: TensorFlow.js imported.';

import { loadLiteRt, loadAndCompile } from 'https://cdn.jsdelivr.net/npm/@litertjs/core@2.5.3/+esm';
document.getElementById('status').textContent = 'Step 3: LiteRT glue imported.';

import { runWithTfjsTensors } from 'https://cdn.jsdelivr.net/npm/@litertjs/tfjs-interop@2.5.3/+esm';
document.getElementById('status').textContent = 'Step 3b: Interop imported.';

const status = document.getElementById('status');
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const log = (msg) => { status.textContent = msg; };

log('Step 4: Checking WASM file status…');
try {
  const response = await fetch('/yolo-test/wasm/litert_wasm_internal.js');
  log('Step 5: WASM file status = ' + response.status);
  if (response.status !== 200) {
    log('❌ File not found at /yolo-test/wasm/. Status: ' + response.status);
    throw new Error('WASM file missing');
  }
} catch (e) {
  log('❌ Fetch failed: ' + e.message);
  throw e;
}

try {
  log('Step 6: Loading LiteRT runtime…');
  await loadLiteRt('/yolo-test/wasm/');
  log('Step 7: Runtime loaded. Loading model…');

  const model = await loadAndCompile('/yolo-test/best.tflite', { accelerator: 'wasm' });
  log('Step 8: Model loaded. Starting camera…');

  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
  });
  video.srcObject = stream;
  await new Promise(r => video.onloadedmetadata = r);
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  log('Step 9: Camera ready. Model is loaded and ready for inference.');

  log('Step 10: Model loaded. Starting detection loop…');

  const CONF_THRESHOLD = 0.35;
  const MODEL_SIZE = 640;
  const COLORS = ['#ffd34e', '#6ea8ff', '#7ddf9b', '#ff8a8a'];

  let running = false;

  const sigmoid = (x) => 1 / (1 + Math.exp(-x));

  const drawRotatedBox = (ctx, box, canvasW, canvasH) => {
    const angleRad = (sigmoid(box.angle) - 0.25) * Math.PI;
    const isNormalized = box.cx < 2 && box.cy < 2;
    const scaleX = isNormalized ? canvasW : canvasW / MODEL_SIZE;
    const scaleY = isNormalized ? canvasH : canvasH / MODEL_SIZE;
    const cx = box.cx * scaleX;
    const cy = box.cy * scaleY;
    const w = box.w * scaleX;
    const h = box.h * scaleY;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angleRad);
    ctx.strokeStyle = COLORS[0];
    ctx.lineWidth = 3;
    ctx.strokeRect(-w / 2, -h / 2, w, h);
    ctx.fillStyle = COLORS[0];
    ctx.font = '16px sans-serif';
    ctx.fillText(`${(box.conf * 100).toFixed(0)}%`, -w / 2, -h / 2 - 6);
    ctx.restore();
  };

  const rotatedIoU = (a, b) => {
    const dx = a.cx - b.cx, dy = a.cy - b.cy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const avgSize = (a.w + a.h + b.w + b.h) / 4;
    return dist < avgSize * 0.5 ? 0.6 : 0;
  };

  const nms = (boxes, iouThresh) => {
    boxes.sort((a, b) => b.conf - a.conf);
    const kept = [];
    const used = new Array(boxes.length).fill(false);
    for (let i = 0; i < boxes.length; i++) {
      if (used[i]) continue;
      kept.push(boxes[i]);
      for (let j = i + 1; j < boxes.length; j++) {
        if (used[j]) continue;
        if (rotatedIoU(boxes[i], boxes[j]) > iouThresh) used[j] = true;
      }
    }
    return kept;
  };

  const detect = async () => {
    if (!running && video.readyState === 4) {
      running = true;
      try {
        const input = tf.tidy(() => {
          const img = tf.browser.fromPixels(video);
          const resized = tf.image.resizeBilinear(img, [MODEL_SIZE, MODEL_SIZE]);
          return resized.div(255.0).expandDims(0).transpose([0, 3, 1, 2]);
        });

        const outputs = await runWithTfjsTensors(model, [input]);
        input.dispose();

        const tensor = Array.isArray(outputs) ? outputs[0] : outputs;
        const data = await tensor.data();
        const shape = tensor.shape;
        tensor.dispose();

        const numCandidates = shape[2];
        const candidates = [];

        for (let i = 0; i < numCandidates; i++) {
          const conf = data[4 * numCandidates + i];
          if (conf < CONF_THRESHOLD) continue;

          const cx = data[0 * numCandidates + i];
          const cy = data[1 * numCandidates + i];
          const w  = data[2 * numCandidates + i];
          const h  = data[3 * numCandidates + i];
          const angle = data[5 * numCandidates + i];

          candidates.push({ cx, cy, w, h, angle, conf });
        }

        const kept = nms(candidates, 0.45);

        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.lineWidth = 3;
        ctx.font = '16px sans-serif';

        for (const box of kept) {
          drawRotatedBox(ctx, box, canvas.width, canvas.height);
        }

        log(`Detected ${kept.length} card${kept.length === 1 ? '' : 's'}`);
      } catch (e) {
        console.error(e);
        log('Detection error: ' + e.message);
      }
      running = false;
    }
    requestAnimationFrame(detect);
  };

  detect();

} catch (e) {
  log('❌ Error: ' + (e.message || String(e)));
}
</script>
</body>
</html>
