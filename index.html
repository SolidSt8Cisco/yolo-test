<script type="module">
document.getElementById('status').textContent = 'Step 1: Script loaded.';

import * as tf from 'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/+esm';
document.getElementById('status').textContent = 'Step 2: TensorFlow.js imported.';

import { loadLiteRt, loadAndCompile } from 'https://cdn.jsdelivr.net/npm/@litertjs/core@2.6.0/+esm';
document.getElementById('status').textContent = 'Step 3: LiteRT glue imported.';

const status = document.getElementById('status');
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const log = (msg) => { status.textContent = msg; };

log('Step 4: Checking WASM file status…');
try {
  const response = await fetch('/yolo-test/wasm/litert_wasm_internal.js');
  log('Step 5: WASM file status = ' + response.status);
  if (response.status !== 200) {
    log('❌ File not found at /yolo-test/wasm/. Status: ' + response.status);
    throw new Error('WASM file missing');
  }
} catch (e) {
  log('❌ Fetch failed: ' + e.message);
  throw e;
}

try {
  log('Step 6: Loading LiteRT runtime…');
  await loadLiteRt('/yolo-test/wasm/');
  log('Step 7: Runtime loaded. Loading model…');

  const model = await loadAndCompile('/yolo-test/best.tflite', { accelerator: 'wasm' });
  log('Step 8: Model loaded. Starting camera…');

  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
  });
  video.srcObject = stream;
  await new Promise(r => video.onloadedmetadata = r);
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  log('Step 9: Camera ready. Model is loaded and ready for inference.');

  // Inference code will go here once we confirm the model loads.
  log('Step 10: ✅ Model loaded successfully. Output shape will be printed here after inference.');

} catch (e) {
  log('❌ Error: ' + (e.message || String(e)));
}
</script>
